name: Download and Chunk File

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Paste your download link here'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download and Chunk File
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          python -c "
          import urllib.request
          import urllib.parse
          import os
          import re
          import html
          import time

          url = os.environ['DOWNLOAD_URL']
          target = 'downloaded_file.zip'
          chunk_size = 50 * 1024 * 1024

          def resolve_mediafire(url):
              print('Resolving MediaFire URL...')

              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': (
                          'Mozilla/5.0 (X11; Linux x86_64) '
                          'AppleWebKit/537.36 '
                          '(KHTML, like Gecko) '
                          'Chrome/131.0 Safari/537.36'
                      )
                  }
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  page = response.read().decode('utf-8', errors='replace')

              # Find the MediaFire download button
              pattern = (
                  r'<a[^>]+'
                  r'href=[\"\\']([^\"\\']+)[\"\\'][^>]+'
                  r'id=[\"\\']downloadButton[\"\\']'
              )

              match = re.search(pattern, page, re.IGNORECASE)

              # Also support id appearing before href
              if not match:
                  pattern = (
                      r'<a[^>]+'
                      r'id=[\"\\']downloadButton[\"\\'][^>]+'
                      r'href=[\"\\']([^\"\\']+)[\"\\']'
                  )
                  match = re.search(pattern, page, re.IGNORECASE)

              if not match:
                  raise RuntimeError(
                      'Could not find MediaFire downloadButton. '
                      'The page may have changed or blocked the request.'
                  )

              direct_url = html.unescape(match.group(1))

              if not direct_url.startswith('http'):
                  direct_url = urllib.parse.urljoin(url, direct_url)

              print('Resolved direct URL:')
              print(direct_url)

              return direct_url

          # Resolve MediaFire share page.
          # If the input is already a direct download URL,
          # use it as-is.
          if 'mediafire.com/file/' in url:
              download_url = resolve_mediafire(url)
          else:
              download_url = url

          # Download with a few retries.
          for attempt in range(1, 4):
              try:
                  print(f'Downloading... attempt {attempt}/3')

                  request = urllib.request.Request(
                      download_url,
                      headers={
                          'User-Agent': (
                              'Mozilla/5.0 (X11; Linux x86_64) '
                              'AppleWebKit/537.36 '
                              '(KHTML, like Gecko) '
                              'Chrome/131.0 Safari/537.36'
                          )
                      }
                  )

                  with urllib.request.urlopen(request, timeout=120) as response:
                      total = response.headers.get('Content-Length')

                      if total:
                          print(
                              f'File size: '
                              f'{int(total) / 1024 / 1024:.2f} MB'
                          )

                      with open(target, 'wb') as f:
                          while True:
                              data = response.read(1024 * 1024)
                              if not data:
                                  break
                              f.write(data)

                  print('Download completed.')
                  break

              except Exception as e:
                  print(f'Download failed: {e}')

                  if attempt == 3:
                      raise

                  # MediaFire signed URL may have expired.
                  # Resolve a fresh one before retrying.
                  if 'mediafire.com/file/' in url:
                      print('Resolving a fresh MediaFire URL...')
                      download_url = resolve_mediafire(url)

                  time.sleep(3)

          print('Splitting into chunks...')

          part_num = 1

          with open(target, 'rb') as f:
              while True:
                  chunk_data = f.read(chunk_size)

                  if not chunk_data:
                      break

                  chunk_name = f'chunk_part_{part_num}'

                  with open(chunk_name, 'wb') as chunk_file:
                      chunk_file.write(chunk_data)

                  size_mb = os.path.getsize(chunk_name) / 1024 / 1024

                  print(
                      f'Created {chunk_name} '
                      f'({size_mb:.2f} MB)'
                  )

                  part_num += 1

          os.remove(target)

          print(f'Created {part_num - 1} chunks.')
          "

      - name: Commit and Push Chunks to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add chunk_part_*

          git commit -m "add: compiler chunks"

          git push
