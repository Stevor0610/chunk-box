name: Download and Chunk File 1

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Paste your download link here'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download and Chunk File
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          python <<'PY'
          import urllib.request
          import urllib.parse
          import os
          import re
          import html


          # ============================================================
          # MediaFire Resolver
          # ============================================================

          def resolve_mediafire(url):
              print('Resolving MediaFire URL...')

              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0'
                  }
              )

              with urllib.request.urlopen(req) as response:
                  page = response.read().decode(
                      'utf-8',
                      errors='ignore'
                  )

              patterns = [
                  r'<a[^>]+id=["\']downloadButton["\'][^>]+href=["\']([^"\']+)',
                  r'<a[^>]+href=["\']([^"\']+)["\'][^>]+id=["\']downloadButton["\']'
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      page,
                      re.IGNORECASE
                  )

                  if match:
                      direct_url = html.unescape(match.group(1))

                      print('MediaFire direct URL found.')

                      return direct_url

              raise RuntimeError(
                  'Could not find MediaFire download URL.'
              )


          # ============================================================
          # pCloud Resolver
          # ============================================================

          def resolve_pcloud(url):
              print('Resolving pCloud URL...')

              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0'
                  }
              )

              with urllib.request.urlopen(req) as response:
                  page = response.read().decode(
                      'utf-8',
                      errors='ignore'
                  )

              # pCloud share page contains the actual download URL
              match = re.search(
                  r'"downloadlink"\s*:\s*"([^"]+)"',
                  page
              )

              if not match:
                  raise RuntimeError(
                      'Could not find pCloud downloadlink.'
                  )

              direct_url = match.group(1)

              # JSON / HTML escaping
              direct_url = direct_url.replace(
                  '\\/',
                  '/'
              )

              direct_url = html.unescape(
                  direct_url
              )

              print('pCloud direct URL found.')

              return direct_url


          # ============================================================
          # Common URL Resolver
          # ============================================================

          def resolve_url(url):
              print('Input URL:')
              print(url)

              # MediaFire
              if 'mediafire.com/file/' in url:
                  return resolve_mediafire(url)

              # pCloud
              if 'pcloud.link/' in url:
                  return resolve_pcloud(url)

              # Normal direct URL
              print('No resolver needed.')

              return url


          # ============================================================
          # Resolve Download URL
          # ============================================================

          url = os.environ['DOWNLOAD_URL']

          download_url = resolve_url(url)

          print('Final download URL:')
          print(download_url)


          # ============================================================
          # Download
          # ============================================================

          target = 'downloaded_file.zip'

          chunk_size = 50 * 1024 * 1024  # 50 MB

          print('Downloading...')

          urllib.request.urlretrieve(
              download_url,
              target
          )


          # ============================================================
          # Split File
          # ============================================================

          print('Splitting into chunks...')

          part_num = 1

          with open(target, 'rb') as f:
              while True:
                  chunk_data = f.read(chunk_size)

                  if not chunk_data:
                      break

                  with open(
                      f'chunk_part_{part_num}',
                      'wb'
                  ) as chunk_file:

                      chunk_file.write(chunk_data)

                  part_num += 1


          # ============================================================
          # Remove Original File
          # ============================================================

          if os.path.exists(target):
              os.remove(target)

          print('Done.')
          print(f'Created {part_num - 1} chunk(s).')

          PY

      - name: Commit and Push Chunks to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add chunk_part_*

          git commit -m "add: compiler chunks"

          git push
