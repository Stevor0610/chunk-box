<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Chunk Downloader</title>
</head>
<body>

<button id="download">下載 ZIP</button>

<script>
document.getElementById("download").onclick = async () => {

    // 使用者設定
    const owner = "Stevor0610";
    const repo = "chunk-box";
    const branch = "main";
    const outputName = "LINEPortable.zip";

    const base = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;
    const chunks = [];

    for (let i = 1; ; i++) {
        const r = await fetch(base + `chunk_part_${i}`);

        if (!r.ok) break;

        chunks.push(await r.arrayBuffer());
        console.log(`chunk_part_${i} ✓`);
    }

    if (!chunks.length) {
        throw new Error("找不到 chunks");
    }

    const file = new Blob(chunks, {
        type: "application/zip"
    });

    const a = document.createElement("a");

    a.href = URL.createObjectURL(file);
    a.download = outputName;
    a.click();

    console.log(
        `完成！ ${(file.size / 1024 / 1024).toFixed(2)} MB`
    );
};
</script>

</body>
</html>
