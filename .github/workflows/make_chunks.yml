name: Download and Chunk File

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Paste your download link here'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==============================================================
      # Checkout
      # ==============================================================

      - name: Checkout Repository
        uses: actions/checkout@v5


      # ==============================================================
      # Python
      # ==============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'


      # ==============================================================
      # Download, Chunk and Upload
      # ==============================================================

      - name: Download, Chunk and Upload
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}

        run: |

          python <<'PY'

          import urllib.request
          import os
          import re
          import html
          import urllib.parse
          import json
          import shutil
          import subprocess


          # ============================================================
          # Configuration
          # ============================================================

          CHUNK_SIZE = 50 * 1024 * 1024

          # Upload every 5 chunks
          UPLOAD_BATCH_SIZE = 5


          # ============================================================
          # MediaFire Resolver
          # ============================================================

          def resolve_mediafire(url):

              print('Resolving MediaFire URL...')

              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0'
                  }
              )

              with urllib.request.urlopen(req) as response:

                  page = response.read().decode(
                      'utf-8',
                      errors='ignore'
                  )

              patterns = [
                  r'<a[^>]+id=["\']downloadButton["\'][^>]+href=["\']([^"\']+)',
                  r'<a[^>]+href=["\']([^"\']+)["\'][^>]+id=["\']downloadButton["\']'
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      page,
                      re.IGNORECASE
                  )

                  if match:

                      direct_url = html.unescape(
                          match.group(1)
                      )

                      print('MediaFire direct URL found.')

                      return direct_url

              raise RuntimeError(
                  'Could not find MediaFire download URL.'
              )


          # ============================================================
          # pCloud Resolver
          # ============================================================

          def resolve_pcloud(url):

              print('Resolving pCloud URL...')

              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0'
                  }
              )

              with urllib.request.urlopen(req) as response:

                  page = response.read().decode(
                      'utf-8',
                      errors='ignore'
                  )

              match = re.search(
                  r'"downloadlink"\s*:\s*"([^"]+)"',
                  page
              )

              if not match:

                  raise RuntimeError(
                      'Could not find pCloud downloadlink.'
                  )

              direct_url = match.group(1)

              direct_url = direct_url.replace(
                  '\\/',
                  '/'
              )

              direct_url = html.unescape(
                  direct_url
              )

              print('pCloud direct URL found.')

              return direct_url


          # ============================================================
          # Common URL Resolver
          # ============================================================

          def resolve_url(url):

              print()
              print('Input URL:')
              print(url)

              if 'mediafire.com/file/' in url:

                  return resolve_mediafire(url)

              if 'pcloud.link/' in url:

                  return resolve_pcloud(url)

              print('No resolver needed.')

              return url


          # ============================================================
          # Get Filename
          # ============================================================

          def get_filename(url, response=None):

              # --------------------------------------------------------
              # 1. Content-Disposition
              # --------------------------------------------------------

              if response:

                  disposition = response.headers.get(
                      'Content-Disposition',
                      ''
                  )

                  match = re.search(
                      r'filename\*?=(?:UTF-8\'\')?["\']?([^"\';]+)',
                      disposition,
                      re.IGNORECASE
                  )

                  if match:

                      filename = urllib.parse.unquote(
                          match.group(1)
                      )

                      if filename:

                          return filename


              # --------------------------------------------------------
              # 2. URL filename
              # --------------------------------------------------------

              path = urllib.parse.urlparse(
                  url
              ).path

              filename = os.path.basename(
                  path
              )

              if filename:

                  filename = urllib.parse.unquote(
                      filename
                  )

                  if filename:

                      return filename


              # --------------------------------------------------------
              # 3. Fallback
              # --------------------------------------------------------

              return 'downloaded_file.zip'


          # ============================================================
          # Git Upload
          # ============================================================

          def upload_batch(batch):

              if not batch:

                  return


              print()
              print('========================================')
              print(
                  f'Uploading {len(batch)} chunks to GitHub'
              )
              print('========================================')


              # --------------------------------------------------------
              # Add chunks
              # --------------------------------------------------------

              for chunk_path in batch:

                  print(
                      f'Adding: {chunk_path}'
                  )

                  subprocess.run(
                      [
                          'git',
                          'add',
                          chunk_path
                      ],
                      check=True
                  )


              # --------------------------------------------------------
              # Commit
              # --------------------------------------------------------

              first_chunk = os.path.basename(
                  batch[0]
              )

              last_chunk = os.path.basename(
                  batch[-1]
              )

              commit_message = (
                  f'add: chunks {first_chunk} to {last_chunk}'
              )


              print()
              print(
                  f'Commit: {commit_message}'
              )


              subprocess.run(
                  [
                      'git',
                      'commit',
                      '-m',
                      commit_message
                  ],
                  check=True
              )


              # --------------------------------------------------------
              # Push
              # --------------------------------------------------------

              print()
              print('Pushing to GitHub...')


              subprocess.run(
                  [
                      'git',
                      'push'
                  ],
                  check=True
              )


              print()
              print('Batch uploaded successfully.')


          # ============================================================
          # Resolve URL
          # ============================================================

          url = os.environ['DOWNLOAD_URL']

          download_url = resolve_url(
              url
          )

          print()
          print('Final download URL:')
          print(download_url)


          # ============================================================
          # Download + Chunk
          # ============================================================

          print()
          print('Opening download...')


          req = urllib.request.Request(
              download_url,
              headers={
                  'User-Agent': 'Mozilla/5.0'
              }
          )


          with urllib.request.urlopen(req) as response:

              filename = get_filename(
                  download_url,
                  response
              )


              print()
              print('Filename:')
              print(filename)


              folder = filename


              # ========================================================
              # Remove old local chunks
              # ========================================================

              if os.path.exists(folder):

                  print()
                  print(
                      f'Removing existing local folder: {folder}'
                  )

                  shutil.rmtree(
                      folder
                  )


              os.makedirs(
                  folder,
                  exist_ok=True
              )


              # ========================================================
              # Download + Split
              # ========================================================

              print()
              print('Starting download and chunking...')

              print(
                  f'Chunk size: '
                  f'{CHUNK_SIZE:,} bytes'
              )

              print(
                  f'Upload batch size: '
                  f'{UPLOAD_BATCH_SIZE} chunks'
              )


              part_num = 1

              total_size = 0

              pending_chunks = []


              while True:

                  chunk_data = response.read(
                      CHUNK_SIZE
                  )


                  if not chunk_data:

                      break


                  chunk_path = os.path.join(
                      folder,
                      f'chunk_part_{part_num}'
                  )


                  # ----------------------------------------------------
                  # Write chunk
                  # ----------------------------------------------------

                  with open(
                      chunk_path,
                      'wb'
                  ) as chunk_file:

                      chunk_file.write(
                          chunk_data
                      )


                  chunk_size_actual = len(
                      chunk_data
                  )


                  total_size += (
                      chunk_size_actual
                  )


                  pending_chunks.append(
                      chunk_path
                  )


                  print()
                  print(
                      '----------------------------------------'
                  )

                  print(
                      f'Created chunk {part_num}'
                  )

                  print(
                      f'Chunk size: '
                      f'{chunk_size_actual:,} bytes'
                  )

                  print(
                      f'Total downloaded: '
                      f'{total_size:,} bytes'
                  )

                  print(
                      f'Pending upload: '
                      f'{len(pending_chunks)}/'
                      f'{UPLOAD_BATCH_SIZE}'
                  )


                  # ----------------------------------------------------
                  # Upload every 5 chunks
                  # ----------------------------------------------------

                  if (
                      len(pending_chunks)
                      >= UPLOAD_BATCH_SIZE
                  ):

                      upload_batch(
                          pending_chunks
                      )

                      pending_chunks.clear()


                  part_num += 1


              # ========================================================
              # Upload remaining chunks
              # ========================================================

              if pending_chunks:

                  print()
                  print(
                      'Uploading final incomplete batch...'
                  )

                  upload_batch(
                      pending_chunks
                  )

                  pending_chunks.clear()


          # ============================================================
          # Download Finished
          # ============================================================

          total_chunks = part_num - 1


          print()
          print('========================================')
          print('ALL CHUNKS UPLOADED')
          print('========================================')


          print(
              f'Filename: {filename}'
          )

          print(
              f'Total size: {total_size:,} bytes'
          )

          print(
              f'Total chunks: {total_chunks}'
          )


          # ============================================================
          # Update files.json
          # ============================================================

          print()
          print('Updating files.json...')


          files = []


          for item in os.listdir('.'):

              # --------------------------------------------------------
              # Only directories
              # --------------------------------------------------------

              if not os.path.isdir(item):

                  continue


              # --------------------------------------------------------
              # Must contain chunk_part_1
              # --------------------------------------------------------

              chunk_path = os.path.join(
                  item,
                  'chunk_part_1'
              )


              if not os.path.exists(
                  chunk_path
              ):

                  continue


              # --------------------------------------------------------
              # Collect chunks
              # --------------------------------------------------------

              chunks = []

              total_file_size = 0


              for chunk_name in os.listdir(item):

                  if not chunk_name.startswith(
                      'chunk_part_'
                  ):

                      continue


                  chunk_path = os.path.join(
                      item,
                      chunk_name
                  )


                  if not os.path.isfile(
                      chunk_path
                  ):

                      continue


                  match = re.match(
                      r'chunk_part_(\d+)$',
                      chunk_name
                  )


                  if not match:

                      continue


                  number = int(
                      match.group(1)
                  )


                  chunks.append(
                      number
                  )


                  total_file_size += (
                      os.path.getsize(
                          chunk_path
                      )
                  )


              if not chunks:

                  continue


              chunks.sort()


              # --------------------------------------------------------
              # Add metadata
              # --------------------------------------------------------

              files.append({
                  'name': item,
                  'size': total_file_size,
                  'chunks': len(chunks)
              })


          # ============================================================
          # Sort files
          # ============================================================

          files.sort(
              key=lambda x: x['name'].lower()
          )


          # ============================================================
          # Write files.json
          # ============================================================

          with open(
              'files.json',
              'w',
              encoding='utf-8'
          ) as f:

              json.dump(
                  files,
                  f,
                  ensure_ascii=False,
                  indent=4
              )


          print()
          print('files.json updated.')


          print()
          print(
              json.dumps(
                  files,
                  ensure_ascii=False,
                  indent=4
              )
          )


          PY


      # ================================================================
      # Commit and Push files.json
      # ================================================================

      - name: Commit and Push files.json
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"


          git add files.json


          if git diff --cached --quiet; then

            echo "No changes to files.json."

            exit 0

          fi


          git commit \
            -m "update: files.json"


          git push
