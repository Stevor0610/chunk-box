name: Download and Chunk File

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Paste your download link here'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # 3. Configure Git
      # IMPORTANT:
      # This must be BEFORE the Python script because
      # the Python script performs git commit/push itself.
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Download, chunk and upload
      - name: Download, Chunk and Upload
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python - <<'PY'
          import os
          import re
          import json
          import shutil
          import subprocess
          import urllib.request
          from urllib.parse import urlparse

          DOWNLOAD_URL = os.environ["DOWNLOAD_URL"]

          CHUNK_SIZE = 50 * 1024 * 1024       # 50 MiB
          UPLOAD_BATCH_SIZE = 5                # 5 chunks per commit/push

          ROOT = os.getcwd()
          FILES_JSON = os.path.join(ROOT, "files.json")


          # ============================================================
          # Git helper
          # ============================================================

          def run_git(*args):
              print(">", "git", *args)

              result = subprocess.run(
                  ["git", *args],
                  cwd=ROOT,
                  text=True
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Git command failed: git {' '.join(args)}"
                  )


          def upload_batch(batch):
              if not batch:
                  return

              print()
              print("=" * 60)
              print(f"Uploading {len(batch)} chunks to GitHub")
              print("=" * 60)

              for path in batch:
                  run_git("add", path)

              first = os.path.basename(batch[0])
              last = os.path.basename(batch[-1])

              commit_message = (
                  f"add: chunks {first} to {last}"
              )

              run_git("commit", "-m", commit_message)
              run_git("push")

              print("Upload batch completed.")
              print()


          # ============================================================
          # Filename detection
          # ============================================================

          def detect_filename(url, response=None):
              # Try Content-Disposition first
              if response is not None:
                  content_disposition = response.headers.get(
                      "Content-Disposition"
                  )

                  if content_disposition:
                      match = re.search(
                          r'filename\*=UTF-8\'\'([^;]+)',
                          content_disposition,
                          re.IGNORECASE
                      )

                      if match:
                          from urllib.parse import unquote
                          return unquote(match.group(1))

                      match = re.search(
                          r'filename="?([^"]+)"?',
                          content_disposition,
                          re.IGNORECASE
                      )

                      if match:
                          return match.group(1)

              # Fallback to URL
              parsed = urlparse(url)
              filename = os.path.basename(parsed.path)

              if filename:
                  return filename

              return "downloaded_file"


          # ============================================================
          # URL resolver
          # ============================================================

          def resolve_url(url):
              print("Original URL:")
              print(url)
              print()

              # --------------------------------------------------------
              # MediaFire
              # --------------------------------------------------------

              if "mediafire.com" in url.lower():
                  print("Detected MediaFire URL")

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(req) as response:
                      html = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                  # MediaFire download button
                  patterns = [
                      r'href="(https://download[^"]+)"',
                      r'href="(https://[^"]*mediafire[^"]*download[^"]+)"',
                      r'"downloadLink":"([^"]+)"'
                  ]

                  for pattern in patterns:
                      match = re.search(
                          pattern,
                          html,
                          re.IGNORECASE
                      )

                      if match:
                          resolved = match.group(1)

                          resolved = (
                              resolved
                              .replace("\\/", "/")
                              .replace("&amp;", "&")
                          )

                          print("Resolved MediaFire URL:")
                          print(resolved)
                          print()

                          return resolved

                  raise RuntimeError(
                      "Could not resolve MediaFire download URL."
                  )


              # --------------------------------------------------------
              # pCloud
              # --------------------------------------------------------

              if "pcloud.com" in url.lower():
                  print("Detected pCloud URL")

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(req) as response:
                      html = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                  patterns = [
                      r'"downloadlink":"([^"]+)"',
                      r'"downloadLink":"([^"]+)"',
                      r'https://[^"\']+\.pcloud[^"\']+'
                  ]

                  for pattern in patterns:
                      match = re.search(
                          pattern,
                          html,
                          re.IGNORECASE
                      )

                      if match:
                          resolved = match.group(1)

                          resolved = (
                              resolved
                              .replace("\\/", "/")
                              .replace("&amp;", "&")
                          )

                          print("Resolved pCloud URL:")
                          print(resolved)
                          print()

                          return resolved

                  # Some pCloud links can be downloaded directly
                  print(
                      "Could not find a separate pCloud URL."
                  )
                  print(
                      "Using original URL."
                  )
                  print()

                  return url


              # --------------------------------------------------------
              # Normal URL
              # --------------------------------------------------------

              print("Using original URL")
              print()

              return url


          # ============================================================
          # Resolve download URL
          # ============================================================

          DOWNLOAD_URL = resolve_url(DOWNLOAD_URL)


          # ============================================================
          # Open download
          # ============================================================

          print("Opening download...")

          request = urllib.request.Request(
              DOWNLOAD_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          response = urllib.request.urlopen(request)

          filename = detect_filename(
              DOWNLOAD_URL,
              response
          )

          print("Filename:", filename)

          # Remove characters that are problematic for paths
          filename = re.sub(
              r'[<>:"/\\|?*]',
              "_",
              filename
          )

          filename = filename.strip()

          if not filename:
              filename = "downloaded_file"

          print("Final filename:", filename)


          # ============================================================
          # File information
          # ============================================================

          total_size = response.headers.get("Content-Length")

          if total_size:
              total_size = int(total_size)
              print(
                  f"File size: {total_size:,} bytes "
                  f"({total_size / 1024 / 1024:.2f} MiB)"
              )
          else:
              total_size = None
              print("File size: unknown")

          print(
              f"Chunk size: {CHUNK_SIZE:,} bytes "
              f"(50 MiB)"
          )

          print()


          # ============================================================
          # Chunk directory
          # ============================================================

          folder = os.path.join(
              ROOT,
              filename
          )

          # Remove an old local copy
          if os.path.exists(folder):
              print(
                  f"Removing existing local folder: {filename}"
              )
              shutil.rmtree(folder)

          os.makedirs(folder, exist_ok=True)


          # ============================================================
          # Download + chunk
          # ============================================================

          chunk_number = 1
          downloaded = 0
          batch = []

          while True:

              chunk_path = os.path.join(
                  folder,
                  f"chunk_part_{chunk_number}"
              )

              remaining = CHUNK_SIZE
              written = 0

              with open(chunk_path, "wb") as chunk_file:

                  while remaining > 0:

                      data = response.read(
                          min(1024 * 1024, remaining)
                      )

                      if not data:
                          break

                      chunk_file.write(data)

                      written += len(data)
                      remaining -= len(data)
                      downloaded += len(data)

              # No data means download is finished
              if written == 0:
                  os.remove(chunk_path)
                  break

              print(
                  f"Created chunk {chunk_number}: "
                  f"{written:,} bytes"
              )

              batch.append(
                  os.path.join(
                      filename,
                      f"chunk_part_{chunk_number}"
                  )
              )

              # --------------------------------------------------------
              # Upload every 5 chunks
              # --------------------------------------------------------

              if len(batch) >= UPLOAD_BATCH_SIZE:
                  upload_batch(batch)
                  batch = []

              chunk_number += 1


          # ============================================================
          # Upload remaining chunks
          # ============================================================

          if batch:
              upload_batch(batch)


          total_chunks = chunk_number - 1

          print()
          print("=" * 60)
          print("All chunks uploaded successfully")
          print("=" * 60)
          print("Filename:", filename)
          print("Size:", downloaded)
          print("Chunks:", total_chunks)
          print()


          # ============================================================
          # Update files.json
          #
          # IMPORTANT:
          # Only done AFTER every chunk has successfully uploaded.
          # Therefore index.html will not show incomplete files.
          # ============================================================

          files = []

          if os.path.exists(FILES_JSON):
              try:
                  with open(
                      FILES_JSON,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      files = json.load(f)

                  if not isinstance(files, list):
                      files = []

              except Exception:
                  files = []


          # Remove existing entry with same filename
          files = [
              item
              for item in files
              if item.get("name") != filename
          ]


          # Add new file
          files.append({
              "name": filename,
              "size": downloaded,
              "chunks": total_chunks
          })


          # Write files.json
          with open(
              FILES_JSON,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  files,
                  f,
                  ensure_ascii=False,
                  indent=4
              )

              f.write("\n")


          print("Updated files.json")


          # ============================================================
          # Final commit
          # ============================================================

          run_git("add", "files.json")

          run_git(
              "commit",
              "-m",
              f"update: add {filename} to files.json"
          )

          run_git("push")

          print()
          print("=" * 60)
          print("DONE")
          print("=" * 60)
          print()
          print(f"File: {filename}")
          print(f"Size: {downloaded:,} bytes")
          print(f"Chunks: {total_chunks}")
          print()
          PY
