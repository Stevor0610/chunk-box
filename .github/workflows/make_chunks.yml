name: Download and Chunk File

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Paste your download link here'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Download and Chunk File
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          python <<'PY'
          import urllib.request
          import os
          import re
          import html
          import urllib.parse
          import json
          import shutil


          # ============================================================
          # MediaFire Resolver
          # ============================================================

          def resolve_mediafire(url):

              print('Resolving MediaFire URL...')

              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0'
                  }
              )

              with urllib.request.urlopen(req) as response:

                  page = response.read().decode(
                      'utf-8',
                      errors='ignore'
                  )

              patterns = [
                  r'<a[^>]+id=["\']downloadButton["\'][^>]+href=["\']([^"\']+)',
                  r'<a[^>]+href=["\']([^"\']+)["\'][^>]+id=["\']downloadButton["\']'
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      page,
                      re.IGNORECASE
                  )

                  if match:

                      direct_url = html.unescape(
                          match.group(1)
                      )

                      print('MediaFire direct URL found.')

                      return direct_url

              raise RuntimeError(
                  'Could not find MediaFire download URL.'
              )


          # ============================================================
          # pCloud Resolver
          # ============================================================

          def resolve_pcloud(url):

              print('Resolving pCloud URL...')

              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0'
                  }
              )

              with urllib.request.urlopen(req) as response:

                  page = response.read().decode(
                      'utf-8',
                      errors='ignore'
                  )

              match = re.search(
                  r'"downloadlink"\s*:\s*"([^"]+)"',
                  page
              )

              if not match:

                  raise RuntimeError(
                      'Could not find pCloud downloadlink.'
                  )

              direct_url = match.group(1)

              direct_url = direct_url.replace(
                  '\\/',
                  '/'
              )

              direct_url = html.unescape(
                  direct_url
              )

              print('pCloud direct URL found.')

              return direct_url


          # ============================================================
          # Common URL Resolver
          # ============================================================

          def resolve_url(url):

              print('Input URL:')
              print(url)

              if 'mediafire.com/file/' in url:

                  return resolve_mediafire(url)

              if 'pcloud.link/' in url:

                  return resolve_pcloud(url)

              print('No resolver needed.')

              return url


          # ============================================================
          # Get Filename
          # ============================================================

          def get_filename(url, response=None):

              # 1. Content-Disposition
              if response:

                  disposition = response.headers.get(
                      'Content-Disposition',
                      ''
                  )

                  match = re.search(
                      r'filename\*?=(?:UTF-8\'\')?["\']?([^"\';]+)',
                      disposition,
                      re.IGNORECASE
                  )

                  if match:

                      filename = urllib.parse.unquote(
                          match.group(1)
                      )

                      if filename:

                          return filename


              # 2. URL filename
              path = urllib.parse.urlparse(
                  url
              ).path

              filename = os.path.basename(
                  path
              )

              if filename:

                  filename = urllib.parse.unquote(
                      filename
                  )

                  if filename:

                      return filename


              # 3. Fallback
              return 'downloaded_file.zip'


          # ============================================================
          # Resolve URL
          # ============================================================

          url = os.environ['DOWNLOAD_URL']

          download_url = resolve_url(url)

          print('Final download URL:')
          print(download_url)


          # ============================================================
          # Download + Chunk
          # ============================================================

          chunk_size = 50 * 1024 * 1024

          print('Downloading...')

          req = urllib.request.Request(
              download_url,
              headers={
                  'User-Agent': 'Mozilla/5.0'
              }
          )

          with urllib.request.urlopen(req) as response:

              filename = get_filename(
                  download_url,
                  response
              )

              print('Filename:')
              print(filename)

              folder = filename


              # ========================================================
              # Remove old chunks
              # ========================================================

              if os.path.exists(folder):

                  print(
                      f'Removing existing folder: {folder}'
                  )

                  shutil.rmtree(folder)


              os.makedirs(
                  folder,
                  exist_ok=True
              )


              # ========================================================
              # Split
              # ========================================================

              print('Splitting into chunks...')

              part_num = 1

              total_size = 0


              while True:

                  chunk_data = response.read(
                      chunk_size
                  )

                  if not chunk_data:

                      break


                  chunk_path = os.path.join(
                      folder,
                      f'chunk_part_{part_num}'
                  )


                  with open(
                      chunk_path,
                      'wb'
                  ) as chunk_file:

                      chunk_file.write(
                          chunk_data
                      )


                  total_size += len(
                      chunk_data
                  )


                  print(
                      f'Created {chunk_path} '
                      f'({len(chunk_data)} bytes)'
                  )


                  part_num += 1


          total_chunks = part_num - 1


          print('Done.')

          print(
              f'Total size: {total_size} bytes'
          )

          print(
              f'Total chunks: {total_chunks}'
          )


          # ============================================================
          # Update files.json
          # ============================================================

          print('Updating files.json...')

          files = []


          for item in os.listdir('.'):

              if not os.path.isdir(item):

                  continue


              chunk_path = os.path.join(
                  item,
                  'chunk_part_1'
              )


              if not os.path.exists(chunk_path):

                  continue


              # --------------------------------------------------------
              # Calculate metadata
              # --------------------------------------------------------

              chunks = []

              total_file_size = 0


              for chunk_name in os.listdir(item):

                  if not chunk_name.startswith(
                      'chunk_part_'
                  ):

                      continue


                  chunk_path = os.path.join(
                      item,
                      chunk_name
                  )


                  if not os.path.isfile(
                      chunk_path
                  ):

                      continue


                  match = re.match(
                      r'chunk_part_(\d+)$',
                      chunk_name
                  )


                  if not match:

                      continue


                  number = int(
                      match.group(1)
                  )


                  chunks.append(
                      number
                  )


                  total_file_size += os.path.getsize(
                      chunk_path
                  )


              if not chunks:

                  continue


              chunks.sort()


              files.append({
                  'name': item,
                  'size': total_file_size,
                  'chunks': len(chunks)
              })


          files.sort(
              key=lambda x: x['name'].lower()
          )


          with open(
              'files.json',
              'w',
              encoding='utf-8'
          ) as f:

              json.dump(
                  files,
                  f,
                  ensure_ascii=False,
                  indent=4
              )


          print('files.json updated.')

          print(
              json.dumps(
                  files,
                  ensure_ascii=False,
                  indent=4
              )
          )

          PY

      - name: Commit and Push Chunks to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "add: compiler chunks"

          git push
