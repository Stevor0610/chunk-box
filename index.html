```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Chunk Downloader</title>
</head>
<body>

<select id="fileSelect"></select>
<button id="download">下載 ZIP</button>

<script>
const owner = "Stevor0610";
const repo = "chunk-box";
const branch = "main";

const base =
    `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;

const fileSelect = document.getElementById("fileSelect");
const downloadButton = document.getElementById("download");


// ============================================================
// Load File List
// ============================================================

async function loadFiles() {

    const r = await fetch(base + "files.json");

    if (!r.ok) {
        throw new Error("找不到 files.json");
    }

    const files = await r.json();

    for (const file of files) {

        const option = document.createElement("option");

        option.value = file;
        option.textContent = file;

        fileSelect.appendChild(option);
    }
}


// ============================================================
// Download
// ============================================================

downloadButton.onclick = async () => {

    const outputName = fileSelect.value;

    if (!outputName) {
        throw new Error("沒有選擇檔案");
    }

    const fileBase =
        base + encodeURIComponent(outputName) + "/";

    const chunks = [];

    for (let i = 1; ; i++) {

        const r = await fetch(
            fileBase + `chunk_part_${i}`
        );

        if (!r.ok) break;

        chunks.push(
            await r.arrayBuffer()
        );

        console.log(
            `${outputName}: chunk_part_${i} ✓`
        );
    }

    if (!chunks.length) {
        throw new Error("找不到 chunks");
    }

    const file = new Blob(
        chunks,
        { type: "application/zip" }
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(file);
    a.download = outputName;
    a.click();

    console.log(
        `完成！ ${(file.size / 1024 / 1024).toFixed(2)} MB`
    );
};


// ============================================================
// Start
// ============================================================

loadFiles().catch(error => {
    console.error(error);
    alert(error.message);
});
</script>

</body>
</html>
```
