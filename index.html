<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chunk Box</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f4f6f8;
            color: #222;
        }


        .container {

            width: min(600px, 92%);

            padding: 32px;

            background: white;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);
        }


        h1 {

            margin-top: 0;
            margin-bottom: 24px;

            text-align: center;
        }


        .file-select {

            width: 100%;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 8px;

            background: white;
        }


        .file-info {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 16px;
        }


        .info-box {

            padding: 14px;

            background: #f5f5f5;

            border-radius: 8px;

        }


        .info-label {

            display: block;

            margin-bottom: 4px;

            font-size: 13px;

            color: #777;
        }


        .info-value {

            font-size: 16px;

            font-weight: 600;
        }


        #download {

            width: 100%;

            margin-top: 20px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        #download:hover {

            background: #444;
        }


        #download:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        .status-text {

            margin-top: 24px;

            text-align: center;

            font-weight: 600;
        }


        .status-text.success {

            color: #198754;
        }


        .status-text.error {

            color: #dc3545;
        }


        .progress-container {

            width: 100%;

            height: 12px;

            margin-top: 12px;

            overflow: hidden;

            background: #e5e5e5;

            border-radius: 999px;
        }


        #progress {

            width: 0%;

            height: 100%;

            background: #222;

            border-radius: 999px;

            transition: width 0.15s ease;
        }


        .percentage {

            margin-top: 8px;

            text-align: center;

            font-size: 24px;

            font-weight: 700;
        }


        .download-info {

            display: flex;

            justify-content: space-between;

            margin-top: 12px;

            font-size: 14px;

            color: #666;
        }


        #message {

            margin-top: 18px;

            padding: 10px;

            text-align: center;

            border-radius: 8px;
        }


        .message {

            display: none;
        }


        .message.success {

            display: block;

            color: #198754;

            background: #eaf7ef;
        }


        .message.error {

            display: block;

            color: #dc3545;

            background: #fdecec;
        }


    </style>

</head>


<body>


    <div class="container">


        <h1>
            Chunk Box
        </h1>


        <select
            id="fileSelect"
            class="file-select"
        >
        </select>


        <div class="file-info">


            <div class="info-box">

                <span class="info-label">
                    File size
                </span>

                <span
                    id="fileSize"
                    class="info-value"
                >
                    0 MB
                </span>

            </div>


            <div class="info-box">

                <span class="info-label">
                    Chunks
                </span>

                <span
                    id="fileChunks"
                    class="info-value"
                >
                    0 chunks
                </span>

            </div>


        </div>


        <button id="download">

            Download

        </button>


        <div
            id="statusText"
            class="status-text"
        >
            Ready
        </div>


        <div
            id="percentage"
            class="percentage"
        >
            0%
        </div>


        <div class="progress-container">

            <div id="progress"></div>

        </div>


        <div class="download-info">


            <span id="chunkInfo">
                0 / 0 chunks
            </span>


            <span id="sizeInfo">
                0 MB
            </span>


        </div>


        <div
            id="message"
            class="message"
        >
        </div>


    </div>


<script>


const owner = "Stevor0610";

const repo = "chunk-box";

const branch = "main";


const base =
    `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;


const fileSelect =
    document.getElementById("fileSelect");


const downloadButton =
    document.getElementById("download");


const statusText =
    document.getElementById("statusText");


const percentage =
    document.getElementById("percentage");


const progress =
    document.getElementById("progress");


const chunkInfo =
    document.getElementById("chunkInfo");


const sizeInfo =
    document.getElementById("sizeInfo");


const fileSize =
    document.getElementById("fileSize");


const fileChunks =
    document.getElementById("fileChunks");


const message =
    document.getElementById("message");


let files = [];


function formatSize(bytes) {


    if (bytes < 1024 * 1024) {

        return (
            (bytes / 1024).toFixed(1)
            + " KB"
        );

    }


    if (bytes < 1024 * 1024 * 1024) {

        return (
            (bytes / 1024 / 1024).toFixed(2)
            + " MB"
        );

    }


    return (
        (bytes / 1024 / 1024 / 1024).toFixed(2)
        + " GB"
    );

}


function resetProgress() {


    progress.style.width =
        "0%";


    percentage.textContent =
        "0%";


    chunkInfo.textContent =
        "0 / 0 chunks";


    sizeInfo.textContent =
        "0 MB";


    statusText.textContent =
        "Ready";


    statusText.className =
        "status-text";


    message.textContent =
        "";


    message.className =
        "message";

}


function updateFileInfo() {


    const selected =
        files.find(
            file =>
                file.name === fileSelect.value
        );


    if (!selected) {


        fileSize.textContent =
            "0 MB";


        fileChunks.textContent =
            "0 chunks";


        return;

    }


    fileSize.textContent =
        formatSize(selected.size);


    fileChunks.textContent =
        `${selected.chunks} chunks`;

}


async function loadFiles() {


    try {


        const response =
            await fetch(
                base
                + "files.json?"
                + Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "找不到 files.json"
            );

        }


        const data =
            await response.json();


        files =
            data.map(file => {


                if (typeof file === "string") {

                    return {

                        name: file,

                        size: 0,

                        chunks: 0

                    };

                }


                return {

                    name: String(file.name),

                    size: Number(file.size),

                    chunks: Number(file.chunks)

                };

            });


        fileSelect.innerHTML =
            "";


        if (files.length === 0) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                "";


            option.textContent =
                "目前沒有可下載的檔案";


            fileSelect.appendChild(
                option
            );


            downloadButton.disabled =
                true;


            updateFileInfo();


            return;

        }


        for (const file of files) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                file.name;


            option.textContent =
                file.name;


            fileSelect.appendChild(
                option
            );

        }


        downloadButton.disabled =
            false;


        updateFileInfo();


    }
    catch (error) {


        console.error(error);


        fileSelect.innerHTML =
            "";


        const option =
            document.createElement(
                "option"
            );


        option.textContent =
            "無法載入檔案清單";


        fileSelect.appendChild(
            option
        );


        downloadButton.disabled =
            true;


        message.textContent =
            error.message;


        message.className =
            "message error";

    }

}


downloadButton.onclick =
    async () => {


        const outputName =
            fileSelect.value;


        if (!outputName) {

            return;

        }


        const selected =
            files.find(
                file =>
                    file.name === outputName
            );


        if (!selected) {

            return;

        }


        downloadButton.disabled =
            true;


        fileSelect.disabled =
            true;


        resetProgress();


        try {


            const totalChunks =
                selected.chunks;


            const totalSize =
                selected.size;


            if (
                !totalChunks
                ||
                !totalSize
            ) {

                throw new Error(
                    "檔案資訊不完整，請重新執行 makechunks workflow。"
                );

            }


            const fileBase =
                base
                + encodeURIComponent(
                    outputName
                )
                + "/";


            const chunks = [];


            let downloadedSize =
                0;


            for (
                let i = 1;
                i <= totalChunks;
                i++
            ) {


                statusText.textContent =
                    `Downloading chunk ${i}...`;


                const response =
                    await fetch(
                        fileBase
                        + `chunk_part_${i}`,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `找不到 chunk_part_${i}`
                    );

                }


                const data =
                    await response.arrayBuffer();


                chunks.push(data);


                downloadedSize +=
                    data.byteLength;


                const percent =
                    Math.min(
                        100,
                        Math.round(
                            downloadedSize
                            / totalSize
                            * 100
                        )
                    );


                progress.style.width =
                    `${percent}%`;


                percentage.textContent =
                    `${percent}%`;


                chunkInfo.textContent =
                    `${i} / ${totalChunks} chunks`;


                sizeInfo.textContent =
                    `${formatSize(downloadedSize)} / ${formatSize(totalSize)}`;

            }


            statusText.textContent =
                "Reconstructing file...";


            const file =
                new Blob(
                    chunks,
                    {
                        type:
                            "application/octet-stream"
                    }
                );


            const url =
                URL.createObjectURL(file);


            const a =
                document.createElement(
                    "a"
                );


            a.href =
                url;


            a.download =
                outputName;


            document.body.appendChild(
                a
            );


            a.click();


            a.remove();


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            progress.style.width =
                "100%";


            percentage.textContent =
                "100%";


            statusText.textContent =
                "Download completed";


            statusText.className =
                "status-text success";


            chunkInfo.textContent =
                `${totalChunks} / ${totalChunks} chunks`;


            sizeInfo.textContent =
                formatSize(totalSize);


            message.textContent =
                `${outputName} 已準備完成`;


            message.className =
                "message success";


        }
        catch (error) {


            console.error(error);


            statusText.textContent =
                "Download failed";


            statusText.className =
                "status-text error";


            message.textContent =
                error.message;


            message.className =
                "message error";


            progress.style.width =
                "0%";


            percentage.textContent =
                "0%";

        }
        finally {


            downloadButton.disabled =
                false;


            fileSelect.disabled =
                false;

        }

    };


fileSelect.onchange =
    () => {


        resetProgress();


        updateFileInfo();

    };


loadFiles();


</script>


</body>

</html>
