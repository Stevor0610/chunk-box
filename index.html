<script>

const owner = "Stevor0610";
const repo = "chunk-box";
const branch = "main";

const base =
    `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;

const fileSelect =
    document.getElementById("fileSelect");

const downloadButton =
    document.getElementById("download");

const statusText =
    document.getElementById("statusText");

const percentage =
    document.getElementById("percentage");

const progress =
    document.getElementById("progress");

const chunkInfo =
    document.getElementById("chunkInfo");

const sizeInfo =
    document.getElementById("sizeInfo");

const fileSize =
    document.getElementById("fileSize");

const fileChunks =
    document.getElementById("fileChunks");

const message =
    document.getElementById("message");

let files = [];


function formatSize(bytes) {

    if (bytes < 1024 * 1024) {

        return (
            (bytes / 1024).toFixed(1)
            + " KB"
        );
    }

    if (bytes < 1024 * 1024 * 1024) {

        return (
            (bytes / 1024 / 1024).toFixed(2)
            + " MB"
        );
    }

    return (
        (bytes / 1024 / 1024 / 1024).toFixed(2)
        + " GB"
    );
}


function resetProgress() {

    progress.style.width = "0%";

    percentage.textContent = "0%";

    chunkInfo.textContent = "0 / 0 chunks";

    sizeInfo.textContent = "0 MB";

    statusText.textContent = "Ready";

    statusText.className = "status-text";

    message.textContent = "";

    message.className = "message";
}


function updateFileInfo() {

    const selected =
        files.find(
            file =>
                file.name === fileSelect.value
        );

    if (!selected) {

        fileSize.textContent = "0 MB";

        fileChunks.textContent = "0 chunks";

        return;
    }

    fileSize.textContent =
        formatSize(selected.size);

    fileChunks.textContent =
        `${selected.chunks} chunks`;
}


async function loadFiles() {

    try {

        const response =
            await fetch(
                base + "files.json?" + Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "找不到 files.json"
            );
        }

        const data =
            await response.json();


        /*
         * 支援新版格式：
         *
         * {
         *     "name": "...",
         *     "size": 123,
         *     "chunks": 1
         * }
         *
         * 也支援舊版：
         *
         * "filename.zip"
         */

        files =
            data.map(file => {

                if (typeof file === "string") {

                    return {
                        name: file,
                        size: 0,
                        chunks: 0
                    };
                }

                return {
                    name: String(file.name),
                    size: Number(file.size),
                    chunks: Number(file.chunks)
                };
            });


        fileSelect.innerHTML = "";


        if (files.length === 0) {

            const option =
                document.createElement("option");

            option.value = "";

            option.textContent =
                "目前沒有可下載的檔案";

            fileSelect.appendChild(option);

            downloadButton.disabled = true;

            updateFileInfo();

            return;
        }


        for (const file of files) {

            const option =
                document.createElement("option");

            /*
             * 這裡一定要使用 file.name
             * 不能直接使用 file
             */

            option.value = file.name;

            option.textContent = file.name;

            fileSelect.appendChild(option);
        }


        downloadButton.disabled = false;

        updateFileInfo();

    }
    catch (error) {

        console.error(error);

        fileSelect.innerHTML = "";

        const option =
            document.createElement("option");

        option.textContent =
            "無法載入檔案清單";

        fileSelect.appendChild(option);

        downloadButton.disabled = true;

        message.textContent =
            error.message;

        message.className =
            "message error";
    }
}


downloadButton.onclick =
    async () => {

        const outputName =
            fileSelect.value;

        if (!outputName) {
            return;
        }


        const selected =
            files.find(
                file =>
                    file.name === outputName
            );

        if (!selected) {
            return;
        }


        downloadButton.disabled = true;

        fileSelect.disabled = true;

        resetProgress();


        try {

            const totalChunks =
                selected.chunks;

            const totalSize =
                selected.size;


            if (!totalChunks || !totalSize) {

                throw new Error(
                    "檔案資訊不完整，請重新執行 makechunks workflow。"
                );
            }


            const fileBase =
                base
                + encodeURIComponent(outputName)
                + "/";


            const chunks = [];

            let downloadedSize = 0;


            for (
                let i = 1;
                i <= totalChunks;
                i++
            ) {

                statusText.textContent =
                    `Downloading chunk ${i}...`;


                const response =
                    await fetch(
                        fileBase
                        + `chunk_part_${i}`,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `找不到 chunk_part_${i}`
                    );
                }


                const data =
                    await response.arrayBuffer();


                chunks.push(data);

                downloadedSize +=
                    data.byteLength;


                const percent =
                    Math.min(
                        100,
                        Math.round(
                            downloadedSize
                            / totalSize
                            * 100
                        )
                    );


                progress.style.width =
                    `${percent}%`;

                percentage.textContent =
                    `${percent}%`;


                chunkInfo.textContent =
                    `${i} / ${totalChunks} chunks`;


                sizeInfo.textContent =
                    `${formatSize(downloadedSize)} / ${formatSize(totalSize)}`;
            }


            statusText.textContent =
                "Reconstructing file...";


            const file =
                new Blob(
                    chunks,
                    {
                        type:
                            "application/octet-stream"
                    }
                );


            const url =
                URL.createObjectURL(file);


            const a =
                document.createElement("a");


            a.href = url;

            a.download = outputName;


            document.body.appendChild(a);

            a.click();

            a.remove();


            setTimeout(
                () => {
                    URL.revokeObjectURL(url);
                },
                1000
            );


            progress.style.width = "100%";

            percentage.textContent = "100%";


            statusText.textContent =
                "Download completed";

            statusText.className =
                "status-text success";


            chunkInfo.textContent =
                `${totalChunks} / ${totalChunks} chunks`;


            sizeInfo.textContent =
                formatSize(totalSize);


            message.textContent =
                `${outputName} 已準備完成`;

            message.className =
                "message success";

        }
        catch (error) {

            console.error(error);

            statusText.textContent =
                "Download failed";

            statusText.className =
                "status-text error";

            message.textContent =
                error.message;

            message.className =
                "message error";

            progress.style.width = "0%";

            percentage.textContent = "0%";
        }
        finally {

            downloadButton.disabled = false;

            fileSelect.disabled = false;
        }
    };


fileSelect.onchange =
    () => {

        resetProgress();

        updateFileInfo();
    };


loadFiles();

</script>
